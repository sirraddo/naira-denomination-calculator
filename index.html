<style>
  :root {
    --paper: #d7e8ce;
    --paper-raised: #e8f1e0;
    --ink: #1c362a;
    --ink-faint: #6d8877;
    --rule: #a8c79c;
    --brass: #a9762e;
    --brass-dark: #8a5f22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 35px, var(--rule) 35px, var(--rule) 36px);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .card {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--ink-faint);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .denom-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .denom-row {
    background: var(--paper-raised);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .denom-label {
    font-weight: 700;
    color: var(--brass-dark);
    font-size: 15px;
    white-space: nowrap;
  }
  .denom-row input {
    width: 64px;
    border: none;
    background: transparent;
    border-bottom: 2px solid var(--rule);
    font-size: 18px;
    text-align: right;
    padding: 4px 2px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .denom-row input:focus {
    outline: none;
    border-bottom-color: var(--brass);
  }
  .subtotal {
    font-size: 11px;
    color: var(--ink-faint);
    text-align: right;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .total-card {
    background: var(--ink);
    color: var(--paper);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .total-label {
    font-size: 13px;
    opacity: 0.75;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .total-value {
    font-size: 36px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }
  .actions {
    display: flex;
    gap: 10px;
  }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-clear {
    background: var(--paper-raised);
    color: var(--ink);
    border: 1px solid var(--rule);
  }
  .btn-copy {
    background: var(--brass);
    color: white;
  }
  .btn-copy.copied {
    background: #3e7a4e;
  }
  .breakdown {
    margin-top: 20px;
    font-size: 13px;
    color: var(--ink-faint);
    text-align: center;
    min-height: 18px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Naira Denomination Calculator</h1>
  <p class="subtitle">Count your notes by denomination — the total adds itself up.</p>

  <div class="denom-grid" id="grid"></div>

  <div class="total-card">
    <div class="total-label">Total</div>
    <div class="total-value" id="total">₦0</div>
  </div>

  <div class="actions">
    <button class="btn-clear" id="clearBtn">Clear</button>
    <button class="btn-copy" id="copyBtn">Copy total</button>
  </div>

  <div class="breakdown" id="breakdown"></div>
</div>

<script>
  const DENOMS = [1000, 500, 200, 100, 50, 20, 10, 5];
  const grid = document.getElementById('grid');
  const totalEl = document.getElementById('total');
  const breakdownEl = document.getElementById('breakdown');
  const clearBtn = document.getElementById('clearBtn');
  const copyBtn = document.getElementById('copyBtn');

  const counts = {};

  function money(n) {
    return '₦' + Number(n).toLocaleString('en-NG');
  }

  function render() {
    grid.innerHTML = '';
    DENOMS.forEach((d) => {
      const row = document.createElement('div');
      row.className = 'denom-row';
      row.innerHTML = `
        <span class="denom-label">₦${d}</span>
        <input type="number" min="0" inputmode="numeric" data-denom="${d}" value="${counts[d] || ''}" placeholder="0" />
      `;
      grid.appendChild(row);
    });
    grid.querySelectorAll('input').forEach((input) => {
      input.addEventListener('input', (e) => {
        const d = e.target.dataset.denom;
        counts[d] = e.target.value;
        updateTotal();
      });
    });
  }

  function updateTotal() {
    let total = 0;
    const parts = [];
    DENOMS.forEach((d) => {
      const c = Number(counts[d]) || 0;
      if (c > 0) {
        total += c * d;
        parts.push(`${c}×₦${d}`);
      }
    });
    totalEl.textContent = money(total);
    breakdownEl.textContent = parts.length ? parts.join('  +  ') : '';
    return total;
  }

  clearBtn.addEventListener('click', () => {
    Object.keys(counts).forEach((k) => delete counts[k]);
    render();
    updateTotal();
  });

  copyBtn.addEventListener('click', async () => {
    const total = updateTotal();
    try {
      await navigator.clipboard.writeText(String(total));
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copy total';
        copyBtn.classList.remove('copied');
      }, 1500);
    } catch (e) {
      alert('Total: ' + money(total));
    }
  });

  render();
  updateTotal();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
