<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Naira Denomination Calculator</title>
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --green:#0b6e4f;
    --green-dark:#075539;
    --gold:#d4a017;
    --bg:#f4f6f5;
    --card:#ffffff;
    --text:#1c2b25;
    --muted:#6b7a73;
    --border:#e2e8e5;
  }
  [data-theme="dark"]{
    --green:#12a074;
    --green-dark:#0b6e4f;
    --gold:#e6b52f;
    --bg:#121815;
    --card:#1c2521;
    --text:#eef3f0;
    --muted:#93a39b;
    --border:#2c3934;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
    transition:background .2s,color .2s;
  }
  header{
    position:relative;
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:#fff;
    padding:22px 18px 26px;
    text-align:center;
    border-bottom:4px solid var(--gold);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.3rem;
    letter-spacing:.3px;
  }
  header p{
    margin:0;
    font-size:.82rem;
    opacity:.9;
  }
  .theme-toggle{
    position:absolute;
    top:16px;
    right:16px;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:1.1rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .tabs{
    display:flex;
    max-width:560px;
    margin:16px auto 0;
    padding:0 14px;
    gap:8px;
  }
  .tab-btn{
    flex:1;
    padding:10px 8px;
    border:none;
    border-radius:10px;
    background:var(--card);
    color:var(--muted);
    font-weight:600;
    font-size:.85rem;
    cursor:pointer;
    border:1px solid var(--border);
  }
  .tab-btn.active{
    background:var(--green);
    color:#fff;
    border-color:var(--green);
  }
  main{
    max-width:560px;
    margin:14px auto 0;
    padding:0 14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  /* Count Cash mode */
  .denom-row{
    display:grid;
    grid-template-columns:70px 1fr 100px;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--border);
  }
  .denom-row:last-child{border-bottom:none;}
  .denom-label{
    font-weight:700;
    font-size:.95rem;
  }
  .denom-label small{
    display:block;
    font-weight:400;
    color:var(--muted);
    font-size:.68rem;
  }
  .denom-input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:1rem;
    text-align:center;
    background:var(--card);
    color:var(--text);
  }
  .denom-total{
    text-align:right;
    font-weight:600;
    font-size:.9rem;
    color:var(--green-dark);
  }
  .grand-total{
    margin-top:14px;
    padding:14px;
    background:var(--green);
    color:#fff;
    border-radius:10px;
    text-align:center;
  }
  .grand-total .amount{
    font-size:1.6rem;
    font-weight:700;
    margin-top:2px;
  }
  .clear-btn{
    width:100%;
    margin-top:10px;
    padding:11px;
    background:none;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--muted);
    font-weight:600;
    cursor:pointer;
  }

  /* Breakdown mode */
  .amount-input{
    width:100%;
    padding:14px;
    font-size:1.3rem;
    text-align:center;
    border:1px solid var(--border);
    border-radius:10px;
    font-weight:700;
    background:var(--card);
    color:var(--text);
  }
  .field-label{
    font-size:.85rem;
    color:var(--muted);
    display:block;
    margin-bottom:6px;
  }
  .change-row{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  .change-due{
    margin-top:14px;
    padding:14px;
    border-radius:10px;
    text-align:center;
  }
  .change-due.positive{
    background:var(--green);
    color:#fff;
  }
  .change-due.negative{
    background:#b3261e;
    color:#fff;
  }
  .change-due .amount{
    font-size:1.5rem;
    font-weight:700;
    margin-top:2px;
  }
  .breakdown-btn{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:10px;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
  }
  .breakdown-result{
    margin-top:14px;
  }
  .breakdown-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .breakdown-item:last-child{border-bottom:none;}
  .breakdown-item .qty{
    background:var(--gold);
    color:#3a2c00;
    font-weight:700;
    border-radius:20px;
    padding:3px 10px;
    font-size:.8rem;
  }
  .empty-note{
    color:var(--muted);
    font-size:.85rem;
    text-align:center;
    padding:10px 0;
  }
  .install-hint{
    font-size:.75rem;
    color:var(--muted);
    text-align:center;
    margin-top:6px;
  }
</style>
</head>
<body>

<header>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
  <h1>🇳🇬 Naira Denomination Calculator</h1>
  <p>Count your cash or break down any amount</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="count">Count Cash</button>
  <button class="tab-btn" data-tab="breakdown">Breakdown</button>
  <button class="tab-btn" data-tab="change">Change Due</button>
</div>

<main>

  <!-- COUNT CASH PANEL -->
  <section class="panel active" id="panel-count">
    <div class="card">
      <div id="denom-rows"></div>
      <button class="clear-btn" id="clearCountBtn">Clear All</button>
    </div>
    <div class="grand-total">
      <div>Total Cash</div>
      <div class="amount" id="countGrandTotal">₦0</div>
    </div>
  </section>

  <!-- BREAKDOWN PANEL -->
  <section class="panel" id="panel-breakdown">
    <div class="card">
      <label for="breakdownAmount" style="font-size:.85rem;color:var(--muted);">Enter amount (₦)</label>
      <input type="number" inputmode="numeric" id="breakdownAmount" class="amount-input" placeholder="0" style="margin-top:6px;">
      <button class="breakdown-btn" id="breakdownBtn">Calculate Breakdown</button>
      <div class="breakdown-result" id="breakdownResult">
        <p class="empty-note">Enter an amount above to see the fewest notes/coins needed.</p>
      </div>
    </div>
  </section>

  <!-- CHANGE DUE PANEL -->
  <section class="panel" id="panel-change">
    <div class="card">
      <div class="change-row">
        <div>
          <label class="field-label" for="priceInput">Amount to Pay (₦)</label>
          <input type="number" inputmode="numeric" id="priceInput" class="amount-input" placeholder="0">
        </div>
        <div>
          <label class="field-label" for="givenInput">Amount Given (₦)</label>
          <input type="number" inputmode="numeric" id="givenInput" class="amount-input" placeholder="0">
        </div>
      </div>
      <button class="breakdown-btn" id="changeBtn">Calculate Change</button>
      <div id="changeDueBox"></div>
      <div class="breakdown-result" id="changeResult"></div>
    </div>
  </section>

  <p class="install-hint">Tip: Use your browser menu → "Add to Home Screen" / "Install App" to use this offline like a normal app.</p>

</main>

<script>
  const DENOMS = [1000, 500, 200, 100, 50, 20, 10, 5, 2, 1];
  const NOTE_TYPES = {1000:'Note',500:'Note',200:'Note',100:'Note',50:'Note',20:'Note',10:'Coin/Note',5:'Coin',2:'Coin',1:'Coin'};

  const fmt = n => '₦' + Number(n).toLocaleString('en-NG');

  // ---- Build Count Cash rows ----
  const rowsContainer = document.getElementById('denom-rows');
  const inputs = {};

  DENOMS.forEach(d => {
    const row = document.createElement('div');
    row.className = 'denom-row';
    row.innerHTML = `
      <div class="denom-label">${fmt(d)}<small>${NOTE_TYPES[d]}</small></div>
      <input type="number" min="0" inputmode="numeric" class="denom-input" data-denom="${d}" placeholder="Qty">
      <div class="denom-total" id="rowtotal-${d}">₦0</div>
    `;
    rowsContainer.appendChild(row);
    inputs[d] = row.querySelector('input');
    inputs[d].addEventListener('input', updateCountTotal);
  });

  function updateCountTotal(){
    let grand = 0;
    DENOMS.forEach(d => {
      const qty = parseInt(inputs[d].value) || 0;
      const rowTotal = qty * d;
      grand += rowTotal;
      document.getElementById(`rowtotal-${d}`).textContent = fmt(rowTotal);
    });
    document.getElementById('countGrandTotal').textContent = fmt(grand);
  }

  document.getElementById('clearCountBtn').addEventListener('click', () => {
    DENOMS.forEach(d => inputs[d].value = '');
    updateCountTotal();
  });

  // ---- Breakdown mode ----
  document.getElementById('breakdownBtn').addEventListener('click', calcBreakdown);
  document.getElementById('breakdownAmount').addEventListener('keydown', e => {
    if(e.key === 'Enter') calcBreakdown();
  });

  function buildBreakdownHTML(amount){
    let remaining = Math.floor(amount);
    let html = '';
    let anyUsed = false;

    DENOMS.forEach(d => {
      const qty = Math.floor(remaining / d);
      if(qty > 0){
        anyUsed = true;
        remaining -= qty * d;
        html += `
          <div class="breakdown-item">
            <span>${fmt(d)} <small style="color:var(--muted)">(${NOTE_TYPES[d]})</small></span>
            <span class="qty">× ${qty}</span>
          </div>`;
      }
    });

    return anyUsed ? html : '<p class="empty-note">No breakdown possible.</p>';
  }

  function calcBreakdown(){
    let amount = Math.floor(Number(document.getElementById('breakdownAmount').value) || 0);
    const resultEl = document.getElementById('breakdownResult');

    if(amount <= 0){
      resultEl.innerHTML = '<p class="empty-note">Enter a valid amount greater than 0.</p>';
      return;
    }

    resultEl.innerHTML = buildBreakdownHTML(amount);
  }

  // ---- Change Due mode ----
  document.getElementById('changeBtn').addEventListener('click', calcChange);
  [document.getElementById('priceInput'), document.getElementById('givenInput')].forEach(el => {
    el.addEventListener('keydown', e => { if(e.key === 'Enter') calcChange(); });
  });

  function calcChange(){
    const price = Number(document.getElementById('priceInput').value) || 0;
    const given = Number(document.getElementById('givenInput').value) || 0;
    const boxEl = document.getElementById('changeDueBox');
    const resultEl = document.getElementById('changeResult');
    const change = given - price;

    if(price <= 0 || given <= 0){
      boxEl.innerHTML = '';
      resultEl.innerHTML = '<p class="empty-note">Enter both the price and the amount given.</p>';
      return;
    }

    if(change < 0){
      boxEl.innerHTML = `
        <div class="change-due negative">
          <div>Amount Still Owed</div>
          <div class="amount">${fmt(Math.abs(change))}</div>
        </div>`;
      resultEl.innerHTML = '<p class="empty-note">The amount given is less than the price — no change to give.</p>';
      return;
    }

    boxEl.innerHTML = `
      <div class="change-due positive">
        <div>Change Due</div>
        <div class="amount">${fmt(change)}</div>
      </div>`;

    resultEl.innerHTML = change > 0
      ? buildBreakdownHTML(change)
      : '<p class="empty-note">Exact amount — no change needed.</p>';
  }

  // ---- Tabs ----
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ---- Dark mode toggle ----
  const themeToggle = document.getElementById('themeToggle');
  const root = document.documentElement;

  function applyTheme(theme){
    if(theme === 'dark'){
      root.setAttribute('data-theme', 'dark');
      themeToggle.textContent = '☀️';
    } else {
      root.removeAttribute('data-theme');
      themeToggle.textContent = '🌙';
    }
  }

  const savedTheme = localStorage.getItem('naira-calc-theme')
    || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(savedTheme);

  themeToggle.addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('naira-calc-theme', next);
  });

  // ---- PWA: register service worker ----
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>

</body>
</html>
